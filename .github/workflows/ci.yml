# KromaRAG CI — required green suite (specs SDD gate + API + Web + Docker + secrets).
# Triggers on push/PR to main. All jobs are required in branch protection.
# Design notes (see README §15):
# - Python 3.12 to match apps/api/Dockerfile (python:3.12-slim), not latest.
# - uv sync UNFROZEN until uv.lock lands (see .gitignore note): run `uv lock`
#   on Python 3.12 + commit, then switch CI to `uv sync --frozen --extra dev`.
# - Web build needs dummy Clerk keys: ClerkProvider validates key format at
#   build time (NODE_ENV=production during `next build`); no live calls occur.
# - Docker context must be apps/api (Dockerfile copies app/, migrations/, scripts/).
# - Trivy/k6 are intentionally NOT required here (nightly/staging); gitleaks
#   scans the PR diff to avoid flagging ancient history on day one.
# - All JS actions run on Node 24 (checkout@v6, setup-node@v6,
#   setup-python@v6, setup-uv@v7, buildx@v4, gitleaks@v3). Do not
#   downgrade — Node 20 was removed from runners in Sept 2026.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-check:
    name: spec:check (SDD gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run spec:check

  api-tests:
    name: api pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run pytest -q

  api-lint:
    name: api ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run ruff check app tests

  api-typecheck:
    name: api mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run mypy app

  api-audit:
    name: api pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run pip-audit

  web-lint:
    name: web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx --workspace apps/web eslint . --max-warnings=0

  web-typecheck:
    name: web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/web

  web-tests:
    name: web vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test --workspace apps/web

  web-build:
    name: web build
    runs-on: ubuntu-latest
    env:
      # NOT SECRETS: format-only placeholders ("foo-bar" base64) so `next build`
      # passes Clerk key-shape validation with zero live calls. Real keys live
      # in Vercel env only, never in repo.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Zm9vLWJhci5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_Zm9vYmFyYmF6cXV4Nzg5MDEyMzQ1Njc4OTA=
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/web

  web-audit:
    name: web audit (prod blocking, dev allowlist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Prod deps must be clean. Dev-only GHSA-vfj7-8cjw-p6xm (braces, no patch)
      # is allowlisted in scripts/audit-web.js; anything new fails.
      - run: npm run audit:web:prod
      - run: npm run audit:web

  docker:
    name: docker build (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - run: docker build -f apps/api/Dockerfile apps/api

  secrets-scan:
    name: gitleaks (PR diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
