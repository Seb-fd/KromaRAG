title = "KromaRAG gitleaks config"

# Extend the default ruleset (do not fork it) — see
# https://github.com/gitleaks/gitleaks#configuration
[extend]
useDefault = true

# Docs prose in README §12.2 describes the spec-gate checks
# (env names + contract tokens on one line) and trips the
# generic-api-key rule. Scoped to that single docs line so real
# key leaks anywhere else still fail CI.
[[allowlist]]
description = "README spec-gate prose false-positives generic-api-key"
paths = ['''README\.md$''']
regexTarget = "line"
regexes = ['''check-specs\.js.*enforces''']

# CI/pre-push need Clerk key-SHAPED values for `next build` format validation
# (zero live calls; real keys live in Vercel env only). These exact values are
# base64 for "foo-bar..." — documented fakes, never real secrets. Scoped to the
# exact placeholder strings in the two files that need them, so real key leaks
# anywhere else still fail CI.
[[allowlist]]
description = "documented fake Clerk placeholders (foo-bar base64, no live value)"
paths = ['''\.github/workflows/ci\.yml$''', '''hooks/pre-push$''']
regexTarget = "line"
regexes = [
  '''pk_test_Zm9vLWJhci5jbGVyay5hY2NvdW50cy5kZXYk''',
  '''sk_test_Zm9vYmFyYmF6cXV4Nzg5MDEyMzQ1Njc4OTA=''',
]
