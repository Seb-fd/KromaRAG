title = "KromaRAG gitleaks config"

# Extend the default ruleset (do not fork it) — see
# https://github.com/gitleaks/gitleaks#configuration
[extend]
useDefault = true

# NOTE: gitleaks 8.24 expects ONE [allowlist] map (not [[allowlist]] array),
# so all scoped false-positives live here. Each regex is an exact documented
# fake, scoped by path + full-line match — real key leaks anywhere else fail.
[allowlist]
description = "scoped doc/CI false-positives: README spec-gate prose + documented foo-bar Clerk placeholders"
paths = ['''README\.md$''', '''\.github/workflows/ci\.yml$''', '''hooks/pre-push$''']
regexTarget = "line"
regexes = [
  '''check-specs\.js.*enforces''',
  '''pk_test_Zm9vLWJhci5jbGVyay5hY2NvdW50cy5kZXYk''',
  '''sk_test_Zm9vYmFyYmF6cXV4Nzg5MDEyMzQ1Njc4OTA=''',
]
