[project]
name = "kromarag-api"
version = "0.1.0"
description = "KromaRAG FastAPI backend — RAG + RBAC agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.0",
  "asyncpg>=0.29",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "google-genai>=1.0",
  "pyjwt>=2.8",
  "cryptography>=42.0",
  "tiktoken>=0.7",
  "pypdf>=4.0",
  "python-multipart>=0.0.18",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langsmith>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
