[project]
name = "kromarag-api"
version = "0.1.0"
description = "KromaRAG FastAPI backend — RAG + RBAC agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.0",
  "asyncpg>=0.29",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "google-genai>=1.0",
  "pyjwt>=2.15",
  "cryptography>=42.0",
  "tiktoken>=0.7",
  "pypdf>=6.19",
  "python-multipart>=0.0.18",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langsmith>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.10", "pip-audit>=2.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM118", "SIM114", "FURB188", "C414"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
# AgentState boundary is typed; best-effort excepts stay untyped by design.
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
